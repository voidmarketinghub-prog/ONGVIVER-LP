<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maquete Interativa — Nova Sede ONG Viver</title>
<meta name="description" content="Explore em 3D o projeto da nova sede da ONG Viver: gire, aproxime, isole os pavimentos e conheça cada ambiente da casa que estamos construindo de tijolinho em tijolinho." />
<link rel="icon" type="image/png" href="assets/flor-viver.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fauna+One&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --yellow:#FFD419; --yellow-deep:#F7B500; --orange:#F58220; --orange-deep:#E86A00;
  --red:#E23B4E; --red-deep:#C92B3D; --ink:#2E2E2C; --ink-soft:#6E6E6A; --cream:#FFFBEE;
  --shadow-md:0 12px 34px rgba(46,46,44,.13); --shadow-lg:0 30px 70px rgba(46,46,44,.2);
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,.8,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Montserrat',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#CDE8F5 0%,#EAF4EC 40%,#F5EFD8 100%);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}

.top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:14px;padding:14px 20px;pointer-events:none}
.top > *{pointer-events:auto}
.back{
  display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-radius:999px;padding:10px 18px;font-weight:700;font-size:13px;color:var(--ink);text-decoration:none;
  box-shadow:var(--shadow-md);transition:transform .2s var(--spring);
}
.back:hover{transform:translateX(-3px)}
.title-chip{
  margin-left:auto;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);border-radius:999px;padding:8px 20px 8px 10px;box-shadow:var(--shadow-md);
}
.title-chip img{height:28px}
.title-chip b{font-family:'Fauna One',serif;font-weight:400;font-size:14px;white-space:nowrap}

.hint{
  position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:9;
  background:rgba(46,46,44,.85);color:#fff;backdrop-filter:blur(8px);border-radius:999px;
  padding:9px 20px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;
  white-space:nowrap;opacity:1;transition:opacity .6s;pointer-events:none;
}
.hint.off{opacity:0}

.floors{
  position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:10;
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  border-radius:999px;padding:8px;box-shadow:var(--shadow-lg);max-width:calc(100vw - 24px);
}
.fbtn{
  border:0;cursor:pointer;border-radius:999px;padding:10px 18px;
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;color:var(--ink);
  background:transparent;transition:background .25s,transform .2s var(--spring);white-space:nowrap;
}
.fbtn:hover{background:#FFF3C4}
.fbtn.on{background:linear-gradient(180deg,var(--yellow),var(--yellow-deep));box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.fbtn:active{transform:scale(.94)}

.room-card{
  position:fixed;left:18px;bottom:84px;z-index:10;max-width:330px;
  background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-radius:20px;
  padding:18px 22px;box-shadow:var(--shadow-lg);border-left:5px solid var(--yellow);
  opacity:0;transform:translateY(14px);pointer-events:none;
  transition:opacity .3s var(--ease),transform .3s var(--spring);
}
.room-card.on{opacity:1;transform:none}
.room-card .rc-floor{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-deep)}
.room-card h2{font-family:'Fauna One',serif;font-weight:400;font-size:19px;margin:3px 0 4px}
.room-card p{font-size:13px;color:var(--ink-soft);line-height:1.55}
.room-card .rc-area{margin-top:8px;display:inline-block;background:#FFF3C4;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:800;color:#7A5B00}

.tip{
  position:fixed;z-index:11;pointer-events:none;background:var(--ink);color:#fff;
  font-size:12px;font-weight:700;border-radius:9px;padding:6px 12px;opacity:0;
  transform:translate(-50%,-140%);transition:opacity .15s;white-space:nowrap;
}

.cta{
  position:fixed;right:18px;bottom:84px;z-index:10;display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,#F0596B,var(--red-deep));color:#fff;border-radius:999px;
  padding:13px 22px;font-weight:700;font-size:13.5px;text-decoration:none;
  box-shadow:0 12px 28px rgba(201,43,61,.4), inset 0 2px 0 rgba(255,255,255,.25);
  transition:transform .2s var(--spring);
}
.cta:hover{transform:translateY(-3px)}

.loading{
  position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(180deg,#FFF6D6,#FFF3C4);transition:opacity .5s;
}
.loading.off{opacity:0;pointer-events:none}
.loading img{width:72px;animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.92);opacity:.7}to{transform:scale(1.06);opacity:1}}
.loading span{font-weight:700;font-size:13px;color:var(--ink-soft)}

@media (max-width:760px){
  .title-chip b{display:none}
  .hint{top:64px;font-size:11px;padding:8px 14px}
  .fbtn{padding:9px 13px;font-size:12px}
  .room-card{left:12px;right:12px;max-width:none;bottom:76px;padding:14px 18px}
  .cta{display:none}
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <img src="assets/flor-viver.png" alt="" />
  <span>Construindo a maquete, tijolinho por tijolinho…</span>
</div>

<canvas id="scene"></canvas>

<header class="top">
  <a class="back" href="index.html">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M15 6l-6 6 6 6"/></svg>
    Voltar ao site
  </a>
  <span class="title-chip">
    <img src="assets/logo-viver.png" alt="ONG Viver" />
    <b>Maquete interativa · Nova sede</b>
  </span>
</header>

<div class="hint" id="hint">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4"/></svg>
  Arraste para girar · Pinça ou scroll para zoom · Toque nos ambientes
</div>

<div class="room-card" id="roomCard">
  <div class="rc-floor" id="rcFloor"></div>
  <h2 id="rcName"></h2>
  <p id="rcDesc"></p>
  <span class="rc-area" id="rcArea"></span>
</div>

<div class="tip" id="tip"></div>

<a class="cta" href="index.html#adquirir">🧱 Quero meu tijolinho</a>

<nav class="floors" aria-label="Pavimentos">
  <button class="fbtn on" data-floor="all">Prédio completo</button>
  <button class="fbtn" data-floor="-1">Pav. inferior</button>
  <button class="fbtn" data-floor="0">Térreo</button>
  <button class="fbtn" data-floor="1">1º pavimento</button>
  <button class="fbtn" data-floor="2">2º pavimento</button>
</nav>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   MAQUETE DETALHADA DA NOVA SEDE DA ONG VIVER
   Baseada nas pranchas aprovadas PR01–PR05 (proporções aproximadas)
   ===================================================================== */

const C = {
  slab:0xEFE6D2, wallIn:0xF7F2E6,
  yellow:0xFFD419, yellowDeep:0xF7B500, orange:0xF58220,
  red:0xE87A8B, blue:0x7FB8E8, green:0x8FD19E, pink:0xF5B8C4,
  lilac:0xC9B8E8, sand:0xEDE0BD, grey:0xB8B2A6, ink:0x3C3C3B,
  white:0xFAF7EF, wood:0xC9A478, woodDark:0x9C7A55, metal:0x9FA4AA,
  glass:0x9FD3E8, court:0x8FD19E,
};

const H = 2.7, SLAB = .4, LVL = H + SLAB + .2;
const BW = 34, BD = 14;

// [nome, x, z, w, d, cor, descrição, mobiliário]
const FLOORS = {
  '-1': { label:'Pavimento inferior', y:-LVL, rooms:[
    ['Recebimento de doações', 0,8.2, 7,5.8, C.orange, 'Onde chegam as doações de alimentos e mantimentos, direto do acesso de carga da Rua Ataúlfo de Paiva.', 'dock'],
    ['Depósito de mantimentos', 0,0, 7,7.6, C.sand, 'Estoque organizado dos alimentos que abastecem as famílias o ano inteiro.', 'shelves'],
    ['Confecção de cestas básicas', 7.6,0, 6.6,7.6, C.green, 'Aqui nascem as cerca de 1.500 cestas básicas entregues por ano.', 'cestas'],
    ['Arquivo', 7.6,8.2, 6.6,5.8, C.lilac, 'Guarda a história e os documentos de 25 anos de Viver.', 'shelves'],
    ['Estacionamento interno', 15,0, 19,14, C.grey, 'Vagas cobertas e área de manobra para a logística da casa.', 'garage'],
  ]},
  '0': { label:'Térreo', y:0, rooms:[
    ['Recepção e acolhimento', 0,0, 5.4,6.4, C.yellow, 'A porta de entrada: onde cada família é recebida pelo nome.', 'reception'],
    ['Capela', 0,7.2, 4.2,4.6, C.lilac, 'Acolhimento também para a alma, de todas as fés.', 'chapel'],
    ['Sala de TV', 4.6,7.2, 3.9,4.6, C.blue, 'Descanso e distração para as crianças e seus acompanhantes.', 'tv'],
    ['Brinquedoteca', 5.8,0, 7,6.4, C.pink, 'Porque criança precisa continuar sendo criança, mesmo durante o tratamento.', 'play'],
    ['Sala de música e livros', 13.2,0, 5.6,6.4, C.green, 'Espaço para imaginar, ler, tocar e criar.', 'library'],
    ['Oficina', 9,7.2, 5,4.6, C.orange, 'Oficinas e atividades para crianças, adolescentes e famílias.', 'workshop'],
    ['Refeitório', 14.4,7.2, 7.2,6.8, C.yellowDeep, 'Mais de 16 mil refeições por ano, agora com muito mais espaço.', 'dining'],
    ['Cozinha e cozinha-escola', 22,7.2, 6.6,6.8, C.red, 'Cozinha profissional e cozinha-escola: alimento e aprendizado juntos.', 'kitchen'],
    ['Mini-quadra', 19.2,0, 5.4,6.4, C.court, 'Esporte, movimento e alegria no processo de recuperação.', 'sport'],
    ['Sala de artesanato', 25,0, 5.4,6.4, C.pink, 'Onde voluntárias produzem o artesanato que ajuda a manter a Viver.', 'craft'],
    ['Circulação e acessos', 29,7.2, 5,6.8, C.sand, 'Hall, escada e elevador: acessibilidade total entre os quatro níveis.', 'stairs'],
  ]},
  '1': { label:'1º pavimento', y:LVL, rooms:[
    ['Consultório odontológico', 0,0, 4.6,5, C.blue, 'Cuidado odontológico completo durante todo o tratamento.', 'dental'],
    ['Serviço social', 5,0, 4.2,5, C.green, 'Mais de 1.300 atendimentos sociais por ano.', 'office'],
    ['Nutricionista', 9.6,0, 4.2,5, C.yellowDeep, 'Acompanhamento nutricional essencial para a recuperação.', 'office'],
    ['Psicologia', 14.2,0, 4.2,5, C.lilac, 'Mais de 900 atendimentos psicológicos por ano, para crianças e famílias.', 'office'],
    ['Administrativo e reuniões', 0,5.6, 8,3.6, C.sand, 'A equipe que faz a Viver funcionar todos os dias.', 'admin'],
    ['Telemarketing · RH · Financeiro', 18.8,0, 6.8,5, C.orange, 'O coração da captação e da gestão transparente.', 'admin'],
    ['Alojamento · 40 leitos', 0,9.8, 14,4.2, C.red, 'Dormitórios para famílias que vêm de longe: ninguém fica sem onde dormir.', 'dorm'],
    ['Quartos de pernoite', 14.6,9.8, 8.4,4.2, C.pink, 'Quartos com beliches e banheiros para os dias de tratamento.', 'dorm'],
    ['Copa das famílias', 23.6,9.8, 4,4.2, C.green, 'Um cantinho de apoio para quem está hospedado.', 'copa'],
    ['Almoxarifado de campanhas', 29,5, 5,8.8, C.grey, 'Guarda os materiais das campanhas, como a do tijolinho.', 'shelves'],
  ]},
  '2': { label:'2º pavimento', y:LVL*2, rooms:[
    ['Salão multiuso', 0,0, 28.6,14, C.yellow, 'Um grande espaço para eventos, festas, formações e os encontros da comunidade Viver.', 'hall'],
    ['Caixa d’água e área técnica', 29,4, 5,6, C.grey, 'A infraestrutura que mantém a casa inteira funcionando.', null],
  ]},
};

// ---------- renderer / cena ----------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xEAF2E4, 130, 260);

const camera = new THREE.PerspectiveCamera(40, 1, .1, 600);
camera.position.set(58, 38, 62);

const controls = new OrbitControls(camera, canvas);
controls.target.set(BW/2 + 3, 2.5, BD/2);
controls.enableDamping = true;
controls.dampingFactor = .07;
controls.minDistance = 10;
controls.maxDistance = 120;
controls.maxPolarAngle = Math.PI * .49;
controls.autoRotate = true;
controls.autoRotateSpeed = .55;

scene.add(new THREE.HemisphereLight(0xEAF4FF, 0xC9BB95, .95));
const sun = new THREE.DirectionalLight(0xFFF2D8, 2.4);
sun.position.set(40, 60, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -55; sun.shadow.camera.right = 70;
sun.shadow.camera.top = 55; sun.shadow.camera.bottom = -40;
sun.shadow.bias = -0.00035;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xCFE4FF, .5);
fill.position.set(-30, 25, -30);
scene.add(fill);

// ---------- texturas procedurais ----------
function canvasTex(w, h, draw, repeat = [1,1]){
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(...repeat);
  t.anisotropy = 4;
  return t;
}
const brickTex = canvasTex(256, 256, (g) => {
  g.fillStyle = '#C98B6B'; g.fillRect(0,0,256,256);
  const bw = 42, bh = 18;
  for (let y = 0; y < 256/bh; y++){
    for (let x = -1; x < 256/bw + 1; x++){
      const off = (y % 2) * bw/2;
      const shade = .88 + Math.random()*.22;
      g.fillStyle = `rgb(${201*shade|0},${139*shade|0},${107*shade|0})`;
      g.fillRect(x*bw + off + 1.5, y*bh + 1.5, bw - 3, bh - 3);
    }
  }
}, [4, 2]);
const asphaltTex = canvasTex(256, 256, (g) => {
  g.fillStyle = '#8E897E'; g.fillRect(0,0,256,256);
  for (let i = 0; i < 1800; i++){
    g.fillStyle = `rgba(${40+Math.random()*60|0},${40+Math.random()*60|0},${40+Math.random()*55|0},.25)`;
    g.fillRect(Math.random()*256, Math.random()*256, 2, 2);
  }
}, [3, 20]);
const courtTex = canvasTex(512, 512, (g) => {
  g.fillStyle = '#8FD19E'; g.fillRect(0,0,512,512);
  g.strokeStyle = '#FAF7EF'; g.lineWidth = 7;
  g.strokeRect(36, 36, 440, 440);
  g.beginPath(); g.arc(256, 256, 70, 0, Math.PI*2); g.stroke();
  g.beginPath(); g.moveTo(36, 256); g.lineTo(476, 256); g.stroke();
  g.fillStyle = '#F7B500';
  g.beginPath(); g.arc(256, 256, 24, 0, Math.PI*2); g.fill();
});
const grassTex = canvasTex(256, 256, (g) => {
  g.fillStyle = '#9CC48C'; g.fillRect(0,0,256,256);
  for (let i = 0; i < 1400; i++){
    g.fillStyle = `rgba(${90+Math.random()*60|0},${150+Math.random()*60|0},${90+Math.random()*50|0},.5)`;
    g.fillRect(Math.random()*256, Math.random()*256, 3, 3);
  }
}, [10, 10]);

// ---------- materiais base ----------
function sm(opts){ return new THREE.MeshStandardMaterial({transparent:true, ...opts}); }
const M = {
  slab: sm({color:C.slab, roughness:.92}),
  wall: sm({color:C.white, roughness:.8}),
  brick: sm({map:brickTex, roughness:.9}),
  glass: sm({color:C.glass, roughness:.15, metalness:.1, opacity:.55}),
  frame: sm({color:0xFFFFFF, roughness:.5}),
  wood: sm({color:C.wood, roughness:.75}),
  woodDark: sm({color:C.woodDark, roughness:.8}),
  metal: sm({color:C.metal, roughness:.35, metalness:.5}),
  white: sm({color:0xFFFFFF, roughness:.6}),
  ink: sm({color:C.ink, roughness:.7}),
  yellow: sm({color:C.yellow, roughness:.55}),
  yellowDeep: sm({color:C.yellowDeep, roughness:.55}),
};

// ---------- terreno urbano ----------
const site = new THREE.Group(); scene.add(site);
function flat(x, z, w, d, mat, y = 0, h = .25){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x + w/2, y - h/2, z + d/2);
  m.receiveShadow = true;
  site.add(m); return m;
}
const baseY = -LVL - .02;
flat(-40, -32, 140, 80, sm({map:grassTex, roughness:1}), baseY - .5, 1);
flat(-14, -32, 7, 80, sm({map:asphaltTex, roughness:1}), baseY + .02);
flat(62, -32, 7, 80, sm({map:asphaltTex, roughness:1}), baseY + .02);
const sidewalkM = sm({color:0xD8D2C2, roughness:1});
flat(-7, -32, 4, 80, sidewalkM, baseY + .06);
flat(58, -32, 4, 80, sidewalkM, baseY + .06);
const laneM = sm({color:0xF2E8C8, roughness:.9});
for (let z = -30; z < 46; z += 6){
  flat(-10.8, z, .5, 2.6, laneM, baseY + .05, .06);
  flat(65.2, z, .5, 2.6, laneM, baseY + .05, .06);
}
// embasamento do lote até o nível do térreo
flat(-3, -4, 61, 22, sm({color:0xE8DFC8, roughness:1}), 0, LVL + .4);

// ---------- vegetação ----------
const leafM = sm({color:0x7FB873, roughness:.9});
const leafM2 = sm({color:0x95C97F, roughness:.9});
function tree(x, z, s = 1){
  const g = new THREE.Group();
  const t = new THREE.Mesh(new THREE.CylinderGeometry(.16*s, .24*s, 1.7*s, 7), M.woodDark);
  t.position.y = .85*s; t.castShadow = true; g.add(t);
  [[0, 2.5, 0, 1.35],[.7, 2, .3, .8],[-.6, 2.1, -.3, .75]].forEach(([dx, dy, dz, r], i) => {
    const f = new THREE.Mesh(new THREE.IcosahedronGeometry(r*s, 1), i ? leafM2 : leafM);
    f.position.set(dx*s, dy*s, dz*s); f.castShadow = true; g.add(f);
  });
  g.position.set(x, baseY + .4, z);
  site.add(g);
}
tree(-5, -8); tree(-5, 24, .85); tree(-5, 36, 1.1); tree(40, -7, .9);
tree(60, 22, 1.05); tree(60, -6, .8); tree(40, 36, .95); tree(-16, 10, 1.1); tree(70, 34, .9);
function shrub(x, z, s = 1){
  const f = new THREE.Mesh(new THREE.SphereGeometry(.5*s, 8, 6), leafM2);
  f.position.set(x, .2 + .35*s, z); f.castShadow = true; site.add(f);
}
[[-2.2,-1],[-2.2,2],[-2.2,12],[-2.2,15],[35,-1.5],[35,15.5]].forEach(a => shrub(...a));

// ---------- helpers ----------
const pickables = [];
const floorGroups = {};
const labelSprites = {};

function box(parent, mat, w, h, d, x, y, z, cast = true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = cast; m.receiveShadow = true;
  if (!cast) m.userData._cast = false;
  parent.add(m); return m;
}
function cyl(parent, mat, r1, r2, h, x, y, z, seg = 10){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
function textSprite(text){
  const pad = 26, fs = 42;
  const probe = document.createElement('canvas').getContext('2d');
  probe.font = `800 ${fs}px Montserrat, sans-serif`;
  const w = Math.ceil(probe.measureText(text).width) + pad*2;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = fs + pad*1.6;
  const ctx = cv.getContext('2d');
  ctx.font = `800 ${fs}px Montserrat, sans-serif`;
  ctx.fillStyle = 'rgba(46,46,44,.88)';
  ctx.beginPath(); ctx.roundRect(2, 2, cv.width - 4, cv.height - 4, 26); ctx.fill();
  ctx.fillStyle = '#FFD419';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, cv.width/2, cv.height/2 + 2);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:t, transparent:true, opacity:0, depthTest:false}));
  const k = .0135;
  sp.scale.set(cv.width*k, cv.height*k, 1);
  return sp;
}

function sofa(g, x, z, w, rot){

}
function chairMesh(g, x, z, rot = 0){
  const grp = new THREE.Group();
  box(grp, M.yellowDeep, .42,.07,.42, 0, .42, 0, false);

function roundTable(g, x, z, col){
  cyl(g, M.woodDark, .07,.09,.72, x, .36, z);

function longTable(g, x, z, len, chairs, benches){

    for (let i = 0; i < n; i++){

function buildFloor(key, f){
  const grp = new THREE.Group();
  const shell = new THREE.Group(); shell.userData.shell = true;
  const inner = new THREE.Group();
  grp.add(shell, inner);
  const y0 = f.y;

  box(inner, M.slab.clone(), BW + 1.2, SLAB, BD + 1.2, BW/2, y0 + SLAB/2, BD/2);

  const wallMat = key === '0' ? M.brick : M.wall;
  const wt = .3;
  if (key !== '-1'){
    const mk = (w, d, x, z) => box(shell, wallMat.clone(), w, H, d, x, y0 + SLAB + H/2, z);
    mk(BW + 1.2, wt, BW/2, -wt/2);
    mk(BW + 1.2, wt, BW/2, BD + wt/2);
    mk(wt, BD, -wt/2, BD/2);
    mk(wt, BD, BW + wt/2 + .45, BD/2);
    for (let i = 0; i < 9; i++){
      const gx = 2.6 + i*3.4;
      box(shell, M.glass.clone(), 2.2, 1.1, .1, gx, y0 + SLAB + H - .95, -wt - .03, false);
      box(shell, M.frame.clone(), 2.4, 1.3, .06, gx, y0 + SLAB + H - .95, -wt - .1, false);
      box(shell, M.glass.clone(), 2.2, 1.1, .1, gx, y0 + SLAB + H - .95, BD + wt + .03, false);
      box(shell, M.frame.clone(), 2.4, 1.3, .06, gx, y0 + SLAB + H - .95, BD + wt + .1, false);
    }
  } else {
    box(shell, M.wall.clone(), 15, H, wt, 7.5, y0 + SLAB + H/2, 0);
    box(shell, M.wall.clone(), 15, H, wt, 7.5, y0 + SLAB + H/2, BD);
    box(shell, M.wall.clone(), wt, H, BD, 0, y0 + SLAB + H/2, BD/2);
  }

  f.rooms.forEach(def => {
    const [name, x, z, w, d, color, desc, furn] = def;
    const rg = new THREE.Group();
    rg.position.set(0, y0 + SLAB, 0);
    inner.add(rg);
    const fl = new THREE.Mesh(new THREE.BoxGeometry(w - .18, .09, d - .18), sm({color, roughness:.85, opacity:.95}));
    fl.position.set(x + w/2, .05, z + d/2);
    fl.receiveShadow = true;
    fl.userData = {name, desc, floorKey:key, area:Math.round(w*d)};
    rg.add(fl); pickables.push(fl);
    const pw = sm({color:0xFFFFFF, roughness:.85, opacity:.9});
    const hwall = 1.1, t = .09;
    [[x + w/2, z + t/2, w - .1, t],[x + w/2, z + d - t/2, w - .1, t],
     [x + t/2, z + d/2, t, d - .1],[x + w - t/2, z + d/2, t, d - .1]].forEach(([cx, cz, ww, dd]) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(ww, hwall, dd), pw.clone());
      m.position.set(cx, hwall/2 + .09, cz);
      m.castShadow = true; m.receiveShadow = true;
      m.userData = fl.userData;
      rg.add(m); pickables.push(m);
    });
    if (furn && FURN[furn]) FURN[furn](rg, x, z, w, d);
    const sp = textSprite(name);
    sp.position.set(x + w/2, y0 + SLAB + 2.7, z + d/2);
    grp.add(sp);
    (labelSprites[key] ??= []).push(sp);
  });

  floorGroups[key] = grp;
  scene.add(grp);
}

// ---------- interação ----------
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
const tip = document.getElementById('tip');
const card = document.getElementById('roomCard');
let hovered = null, selected = null, currentFloor = 'all';

function setEmissive(mesh, on){
  if (!mesh.material.emissive) return;
  mesh.material.emissive = new THREE.Color(on ? 0x6b5a00 : 0x000000);
  mesh.material.emissiveIntensity = on ? .6 : 0;
}
function pick(e){
  const r = canvas.getBoundingClientRect();
  ptr.x = ((e.clientX - r.left)/r.width)*2 - 1;
  ptr.y = -((e.clientY - r.top)/r.height)*2 + 1;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(pickables, false).filter(h => h.object.material.opacity > .45);
  return hits[0]?.object || null;
}
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  const m = pick(e);
  if (m !== hovered){
    if (hovered && hovered !== selected) setEmissive(hovered, false);
    hovered = m;
    if (m){ setEmissive(m, true); canvas.style.cursor = 'pointer'; }
    else canvas.style.cursor = 'grab';
  }
  if (m){
    tip.textContent = m.userData.name;
    tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px';
    tip.style.opacity = 1;
  } else tip.style.opacity = 0;
});
let downAt = null;
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; stopAuto(); });
canvas.addEventListener('pointerup', e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]);
  downAt = null;
  if (moved > 7) return;
  const m = pick(e);
  if (selected) setEmissive(selected, false);
  selected = m;
  if (m){
    setEmissive(m, true);
    document.getElementById('rcFloor').textContent = FLOORS[m.userData.floorKey]?.label || 'Térreo';
    document.getElementById('rcName').textContent = m.userData.name;
    document.getElementById('rcDesc').textContent = m.userData.desc;
    document.getElementById('rcArea').textContent = '≈ ' + m.userData.area + ' m² (aprox.)';
    card.classList.add('on');
  } else card.classList.remove('on');
});
function stopAuto(){
  controls.autoRotate = false;
  document.getElementById('hint').classList.add('off');
}
canvas.addEventListener('wheel', stopAuto, {passive:true});

// ---------- estados ----------
const FADE = {};
let roofTarget = {op:1, lift:0};
let facadeTarget = 1;
function setFloor(key){
  currentFloor = key;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.toggle('on', b.dataset.floor === key));
  const order = ['-1','0','1','2'];
  for (const k of order){
    const iK = order.indexOf(k), iS = order.indexOf(key);
    let op = 1, lift = 0, shell = 1, labels = 0;
    if (key !== 'all'){
      if (k === key){ op = 1; shell = .10; labels = 1; }
      else if (iK > iS){ op = .06; shell = .04; lift = 8 + (iK - iS)*2.5; }
      else { op = .3; shell = .12; }
    }
    FADE[k] = {op, lift, shell, labels};
  }
  roofTarget = key === 'all' ? {op:1, lift:0} : {op:.05, lift:11};
  facadeTarget = key === 'all' ? 1 : (key === '0' || key === '1' ? .3 : .06);
  card.classList.remove('on');
  if (selected){ setEmissive(selected, false); selected = null; }
}
document.querySelectorAll('.fbtn').forEach(b =>
  b.addEventListener('click', () => { setFloor(b.dataset.floor); stopAuto(); }));
setFloor('all');

// ---------- loop ----------
function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
function lerpOpacity(root, target, dt){
  root.traverse(o => {
    if (o.isSprite) return;
    if (o.material && 'opacity' in o.material){
      const base = o.userData._baseOp ??= (o.material.opacity ?? 1);
      o.material.transparent = true;
      o.material.opacity += (target*base - o.material.opacity)*Math.min(1, dt*6);
      o.castShadow = o.material.opacity > .5 && o.userData._cast !== false;
    }
  });
}
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  for (const [k, grp] of Object.entries(floorGroups)){
    const f = FADE[k]; if (!f) continue;
    grp.position.y += (f.lift - grp.position.y)*Math.min(1, dt*6);
    grp.children.forEach(ch => {
      if (ch.isSprite){
        ch.material.opacity += (f.labels - ch.material.opacity)*Math.min(1, dt*5);
        return;
      }
      lerpOpacity(ch, ch.userData.shell ? f.shell : f.op, dt);
    });
  }
  roofG.position.y += (roofTarget.lift - roofG.position.y)*Math.min(1, dt*6);
  lerpOpacity(roofG, roofTarget.op, dt);
  lerpOpacity(facade, facadeTarget, dt);
  lerpOpacity(lotG, currentFloor === 'all' || currentFloor === '0' ? 1 : .15, dt);
  controls.update();
  renderer.render(scene, camera);
});

document.getElementById('loading').classList.add('off');
setTimeout(() => document.getElementById('hint')?.classList.add('off'), 9000);
</script>
</body>
